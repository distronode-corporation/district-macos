# gitleaks configuration: the default rules.
#
# ⛔ ANY ALLOWLIST ADDED HERE IS SCOPED TO ONE RULE, NAMED FILES AND THE EXACT VALUES, with
# `condition = "AND"`, as in district-ios. A path-only allowlist would also hide a real
# secret pasted into the same file later.
#
# ⚠️ Paths are matched with `(^|/)` rather than `^` because `gitleaks dir <path>` reports them
# with the scanned directory in front, while `gitleaks git` reports them repository-relative.
#
# Each entry below says what its value is: a public key, a public checksum and a truncated
# key header used as test data. None is a credential.

[extend]
useDefault = true

# Sparkle's `SUPublicEDKey` in project.yml (and the same value as release-preflight.test.sh's
# well-formed fixture): the PUBLIC half of the Developer ID build's
# update-signing key (Ed25519, base64), shipped in every copy's Info.plist so Sparkle can
# check an update's signature. Public by design; the private half lives only in the release
# lane's secret store. The rule matches it only because of the key name beside it.
# ⛔ The exact value: rotating the key (which strands every installed copy) means editing
# this regex in the same commit, and the old value stays because history keeps it.
[[allowlists]]
description = "Sparkle SUPublicEDKey in project.yml (a public key)"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)project\.yml$''', '''(^|/)scripts/release-preflight\.test\.sh$''']
regexTarget = "secret"
regexes = ['''^2WeJT5IvJAjXbzYQufEbGBqNu5SSZ5B9to10em8H7QQ=$''']

# The published SHA-256 of the sentry-cli release binary that release.yml pins and checks
# before running it, as in district-ios. A checksum of a public download, not a credential;
# the Sentry token rule matches it only because of the variable name beside it.
[[allowlists]]
description = "sentry-cli release checksum pinned in release.yml (public SHA-256)"
targetRules = ["sentry-access-token"]
condition = "AND"
paths = ['''(^|/)\.github/workflows/release\.yml$''']
regexTarget = "secret"
regexes = ['''^2c26914636c47ab9bf9e710484ad7b44d371cbec8bd29cafb36b3cf877bf4285$''']

# The stand-in App Store Connect key in the key-fetch script's tests, copied from district-ios.
# Its one body line is the fixed PKCS#8 prefix every P-256 private key starts with (the
# algorithm and curve identifiers), cut off before any key bytes, so it is not a key and
# signs nothing.
[[allowlists]]
description = "Truncated PKCS#8 P-256 header used as a stand-in .p8 in asc-key.test.sh (test data)"
targetRules = ["private-key"]
condition = "AND"
paths = ['''(^|/)scripts/asc-key\.test\.sh$''']
regexTarget = "secret"
regexes = ['''^-----BEGIN PRIVATE KEY-----\s+MIGTAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBHkwdwIBAQQg\s+-----END PRIVATE KEY-----$''']

# The LiveKit end-to-end-encryption key in the persona audition's tests, copied from
# district-ios with the same allowlist. It is base64(HMAC-SHA256("contract-e2ee-master-secret",
# roomName)) for room `preview_ws-contract-test_00000000-0000-4000-8000-000000000000`, the
# server contract suite's fixed test secret, so it protects no real room.
[[allowlists]]
description = "LiveKit E2EE key in PersonaPreviewStateTests (test data)"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)App/Tests/PersonaPreviewStateTests\.swift$''']
regexTarget = "secret"
regexes = ['''^YfxKDUkaaGp2WrLLGHCHbe2nn5ArCWBd\+x\+k7EzDr/8=$''']
