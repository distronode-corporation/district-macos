name: Visual and style QA (screenshots, not a gate)

# QA ONLY, on the visual-qa/apple-capture branch and never merged: the app walked over the
# contract fixtures (and, in French, the fictional Québec sample data in qa/quebec) by
# App/UITests/VisualQATourTests.swift, in en-US and fr-CA, light and dark, in a 1000x700
# window (the app's minimum width) and once at 1440x900, plus the empty, error and loading
# states (qa/mock_server.py's QA_MODE) and the ring panel. One build per job; the walks run
# one after another. The frames and accessibility trees are the artifacts. No secret is
# read: the session is a made-up one the mock accepts.
on:
  push:
    branches: [visual-qa/apple-capture]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  walk:
    name: walk (Mac, ${{ matrix.set }})
    runs-on: macos-26
    timeout-minutes: 170
    strategy:
      fail-fast: false
      # ⚠️ ONE AT A TIME: the free plan runs five macOS jobs at once for the whole
      # organisation, and the release pull requests need theirs.
      max-parallel: 1
      matrix:
        include:
          # Each run is `<language>|<QA_MODE, ring or ->|<test>,<test>`.
          - set: light
            appearance: Light
            runs: >-
              en|-|test_01_enUS_light
              fr|-|test_02_frCA_light
              fr|-|test_05_frCA_wide
              en|empty|test_06_enUS_empty
              en|error|test_07_enUS_error
              en|slow|test_08_enUS_loading
              fr|empty|test_09_frCA_empty
              fr|ring|test_10_ring_frCA
              en|ring|test_11_ring_enUS
          - set: dark
            appearance: Dark
            runs: >-
              en|-|test_03_enUS_dark
              fr|-|test_04_frCA_dark
              fr|ring|test_12_ring_frCA_dark
              en|ring|test_13_ring_enUS_dark
    env:
      APPEARANCE: ${{ matrix.appearance }}
      RUNS: ${{ matrix.runs }}
      NSUnbufferedIO: "YES"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: distronode-corporation/district-core-swift
          ref: 7.0.0
          path: core-fixtures
          persist-credentials: false

      - name: Select Xcode and install XcodeGen
        id: xcode
        env:
          XCODEGEN_VERSION: 2.46.0
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version
          echo "version=26.3" >>"$GITHUB_OUTPUT"
          cd "$RUNNER_TEMP"
          curl -fsSL -o xcodegen.zip \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  xcodegen.zip" | shasum -a 256 -c -
          unzip -q xcodegen.zip
          sudo ./xcodegen/install.sh

      # QA build only: the app talks to the mock on 127.0.0.1 over http and ws.
      - name: Allow the local mock
        run: |
          set -euo pipefail
          python3 - <<'PY'
          p = "project.yml"
          s = open(p).read()
          anchor = "      properties:\n        CFBundleDisplayName: District AI\n"
          assert s.count(anchor) == 1, "Info.plist anchor moved"
          s = s.replace(anchor, anchor + "        NSAppTransportSecurity:\n          NSAllowsLocalNetworking: true\n", 1)
          open(p, "w").write(s)
          PY
          xcodegen generate --spec project.yml

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: SourcePackages
          key: sourcepackages-xcode-${{ steps.xcode.outputs.version }}-${{ hashFiles('project.yml') }}

      # The system appearance, so the menu bar, the menus and every window agree; the walk
      # also passes -AppleInterfaceStyle for dark. Read back so a refusal is visible.
      - name: Appearance
        run: |
          if [ "$APPEARANCE" = "Dark" ]; then
            defaults write -g AppleInterfaceStyle Dark
            osascript -e 'tell application "System Events" to tell appearance preferences to set dark mode to true' || true
          else
            defaults delete -g AppleInterfaceStyle 2>/dev/null || true
            osascript -e 'tell application "System Events" to tell appearance preferences to set dark mode to false' || true
          fi
          echo "AppleInterfaceStyle: $(defaults read -g AppleInterfaceStyle 2>/dev/null || echo Light)"
          sw_vers
          system_profiler SPDisplaysDataType | grep -E "Resolution|Retina" || true

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project DistrictMac.xcodeproj -scheme DistrictMacScreenshots \
            -destination 'platform=macOS' -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            CODE_SIGN_ENTITLEMENTS="$GITHUB_WORKSPACE/App/AdHoc.entitlements" 2>&1 \
            | tee build.log | xcbeautify --renderer github-actions
          grep -q '\*\* TEST BUILD SUCCEEDED \*\*' build.log

      - name: Walks
        timeout-minutes: 140
        run: |
          set -uo pipefail
          mkdir -p results
          index=0
          for run in $RUNS; do
            index=$((index + 1))
            IFS='|' read -r lang mode tests <<<"$run"
            dirs="core-fixtures/contracts/mobile"
            [ "$lang" = "fr" ] && dirs="qa/quebec:core-fixtures/contracts/mobile"
            ring=""
            [ "$mode" = "ring" ] && ring=1 && mode=""
            [ "$mode" = "-" ] && mode=""
            pkill -f qa/mock_server.py || true
            sleep 1
            QA_MODE="$mode" nohup python3 qa/mock_server.py "$dirs" 8765 >"results/mock-$index.log" 2>&1 &
            sleep 2
            curl -fsS http://127.0.0.1:8765/api/district/workspace/list | head -c 160; echo
            [ -n "$ring" ] && curl -fsS -X POST http://127.0.0.1:8765/qa/arm-ring
            only=()
            IFS=',' read -r -a names <<<"$tests"
            for t in "${names[@]}"; do only+=("-only-testing:DistrictMacUITests/VisualQATourTests/$t"); done
            echo "::group::run $index: $lang mode=${mode:-none} ring=${ring:-0} $tests"
            xcodebuild test-without-building -project DistrictMac.xcodeproj -scheme DistrictMacScreenshots \
              -destination 'platform=macOS' -derivedDataPath DerivedData \
              -clonedSourcePackagesDirPath SourcePackages -resultBundlePath "results/run-$index.xcresult" \
              "${only[@]}" 2>&1 | tee "results/walk-$index.log" | xcbeautify --renderer github-actions || true
            echo "::endgroup::"
            grep -h 'VQA-TOUR' "results/walk-$index.log" | sort -u || true
          done
          pkill -f qa/mock_server.py || true

      - name: Export the frames
        if: always()
        run: |
          mkdir -p shots
          for r in results/run-*.xcresult; do
            [ -d "$r" ] || continue
            name="$(basename "$r" .xcresult)"
            xcrun xcresulttool export attachments --path "$r" --output-path "shots/$name" >/dev/null || true
          done
          find shots -name '*.png' | wc -l
          grep -h 'VQA-TOUR' results/walk-*.log | sort -u >shots/tour-report.txt || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: vqa-mac-${{ matrix.set }}
          path: |
            shots
            results/*.log
            build.log
          if-no-files-found: warn
          retention-days: 14
