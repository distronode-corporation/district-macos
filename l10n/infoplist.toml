[meta]
catalog = "infoplist"
platform = "swift"
apple = true

[infoplist.camera_usage]
en = "District AI uses the camera only in meeting rooms you join, never on phone calls."
ctx = "legal"
screen = "permissions"
tier = "T0"
id = { apple = "NSCameraUsageDescription" }
note = "The macOS camera permission prompt. Must stay true for both surfaces: the softphone publishes no video in either direction. Must equal project.yml's Info.plist value."

[infoplist.microphone_usage]
en = "District AI uses the microphone for calls you place and answer, meeting rooms you join, and persona previews you start."
ctx = "legal"
screen = "permissions"
tier = "T0"
id = { apple = "NSMicrophoneUsageDescription" }
note = "The macOS microphone permission prompt. Must equal project.yml's Info.plist value."
